name: Python security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  syntax-and-https:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m py_compile Yihop.py
      - name: Verify HTTPS validation has not been disabled
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("Yihop.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  for keyword in node.keywords:
                      if keyword.arg == "verify" and isinstance(keyword.value, ast.Constant):
                          assert keyword.value.value is not False, "HTTPS verification cannot be disabled"
          assert "disable_warnings" not in source, "Do not hide TLS warnings"
          print("TLS security checks passed.")
          PY
