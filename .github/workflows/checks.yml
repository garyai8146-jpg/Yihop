name: Inventory and order safety checks

on:
  push:
    branches: [main, fix/order-safety-20261111]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all application modules
        run: python -m py_compile Yihop.py order_core.py order_storage.py auth_core.py external_services.py
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline business logic and security regression tests
        run: python -m unittest discover -s tests -v
      - name: Launch app with no secrets (must fail closed)
        run: YIHOP_CI_STREAMLIT=1 python -m unittest discover -s tests -p test_app_smoke.py -v
      - name: Ensure TLS verification stays enabled
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s = Path("Yihop.py").read_text(encoding="utf-8")
          tree = ast.parse(s)
          for node in ast.walk(tree):
              if isinstance(node, ast.Call):
                  for kw in node.keywords:
                      if kw.arg == "verify" and isinstance(kw.value, ast.Constant):
                          assert kw.value.value is not False
          assert "disable_warnings" not in s
          print("TLS security checks passed")
          PY
